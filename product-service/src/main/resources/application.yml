# =====================================================================================
# FILE: product-service/src/main/resources/application.yml
# MODULE: product-service (Product Catalog & Category Microservice)
# PURPOSE: Configures server port 8082, PostgreSQL datasource, Redis read-through
#          cache TTLs, Flyway migrations, and Eureka registration.
#
# DESIGN PATTERN / ARCHITECTURAL CONCEPT:
# - Microservice Port Allocation: Dedicated port 8082.
# - Database-per-Service Pattern: Isolated PostgreSQL schema (`product_db`).
# - Cache-Aside / Read-Through Pattern: Redis caching with 10-minute default TTL.
#
# READING ORDER:
# - Read PREVIOUS: pom.xml
# - Read THIS FILE: Understand configurations, caching properties, and DB targets.
# - Read NEXT: src/main/resources/db/migration/V1__init_product_schema.sql
#
# TRICKY INTERVIEW QUESTIONS & ARCHITECTURAL WISDOM:
# Q1: Why do we set `spring.jpa.open-in-view: false`?
# A1: OSIV (Open Session In View) keeps the Hibernate database connection open during
#     the entire view rendering / JSON serialization phase. In a high-traffic microservice,
#     this quickly exhausts HikariCP connection pools. Turning it OFF forces all database
#     fetches to happen strictly inside @Transactional boundaries, preventing lazy loading
#     leaks and N+1 query surprises during Jackson serialization.
#
# Q2: Why disable caching null values (`cache-null-values: false`)?
# A2: Caching null values can protect against Cache Penetration (attackers repeatedly
#     requesting non-existent IDs), but in product catalog systems with high ID churn,
#     it wastes Redis memory. For production, we combine `cache-null-values: false`
#     with input validation and Bloom Filters when needed.
# =====================================================================================

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api

spring:
  application:
    name: product-service

  # PostgreSQL Database Connection
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:product_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ProductServiceHikariCP
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # JPA & Hibernate Settings
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Flyway is the single source of truth for DDL changes!
    open-in-view: false # CRITICAL: Disables OSIV to prevent connection pool starvation
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  # Flyway Schema Evolution
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis Configuration for Read-Through Caching
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # Spring Cache Manager Properties
  cache:
    type: redis
    redis:
      time-to-live: 600000 # Default TTL: 10 minutes (600,000 ms)
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "ecommerce:product:"

# Eureka Service Discovery Registration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}:${random.uuid}

# Actuator Endpoints for Health, Liveness, and Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# SpringDoc OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
