spring:
  application:
    name: product-service-test
  datasource:
    url: jdbc:h2:mem:product_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false # Tests use JPA ddl-auto for speed
  cache:
    type: none # Disable Redis in unit slice tests

eureka:
  client:
    enabled: false

server:
  port: -1
