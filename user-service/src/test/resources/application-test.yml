server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: user-service-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false # H2 creates schema automatically via ddl-auto for unit tests

eureka:
  client:
    enabled: false

jwt:
  rsa:
    private-key-path: classpath:certs/private_key.pem
    public-key-path: classpath:certs/public_key.pem
  access:
    secret: dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JBY2Nlc3NUb2tlbjEyMzQ1Ng==
    expiration: 15
  refresh:
    secret: dGhpc0lzQURpZmZlcmVudFNlY3VyZVNlY3JldEtleUZvclJlZnJlc2hUb2tlbjc4OTA=
    expiration: 10080
  forgot_password:
    secret: dGhpc0lzQVNlY3VyZVNlY3JldEtleUZvckZvcmdvdFBhc3N3b3JkVG9rZW4xMTIy
